<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Winter App...</title>
    <meta name="description" content="Download Winter: Free & Safe Dating App directly on Google Play Store.">
    <!-- Instant Fallback Redirect -->
    <meta http-equiv="refresh" content="1; url=https://play.google.com/store/apps/details?id=com.app.screentime">
    <link rel="canonical" href="https://winterdating.com/download">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #FFF5F5;
            color: #1A1A1A;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #FFFFFF;
            padding: 40px 28px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(107, 29, 42, 0.08);
            max-width: 380px;
            width: 100%;
        }
        .logo {
            font-family: Georgia, serif;
            font-style: italic;
            font-size: 32px;
            font-weight: 700;
            color: #6B1D2A;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #1A1A1A;
        }
        p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #F0E8E8;
            border-top-color: #6B1D2A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #6B1D2A;
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 100px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 14px rgba(107, 29, 42, 0.25);
        }
        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
    <script>
        function openPlayStore() {
            var playStoreAppUrl = "market://details?id=com.app.screentime";
            var playStoreWebUrl = "https://play.google.com/store/apps/details?id=com.app.screentime";

            // If user is on Android, trigger native market URI
            var isAndroid = /android/i.test(navigator.userAgent.toLowerCase());

            if (isAndroid) {
                window.location.href = playStoreAppUrl;
                setTimeout(function() {
                    window.location.href = playStoreWebUrl;
                }, 1000);
            } else {
                window.location.href = playStoreWebUrl;
            }
        }

        // Auto trigger immediately on page load
        window.onload = function() {
            openPlayStore();
        };
    </script>
</head>
<body>
    <div class="card">
        <div class="logo">winter</div>
        <div class="spinner"></div>
        <h1>Opening Google Play...</h1>
        <p>Redirecting you to install <strong>Winter: Free &amp; Safe Dating App</strong>.</p>
        <a href="https://play.google.com/store/apps/details?id=com.app.screentime" class="btn" onclick="openPlayStore();">
            <svg viewBox="0 0 24 24"><path d="M3 20.5v-17c0-.59.34-1.11.84-1.35L13.69 12l-9.85 9.85c-.5-.24-.84-.76-.84-1.35zm13.81-5.38L6.05 21.34l8.49-8.49 2.27 2.27zm3.35-1.86c.39.22.64.64.64 1.11 0 .47-.25.89-.64 1.11l-2.08 1.19-2.5-2.5 2.5-2.5 2.08 1.19zM6.05 2.66l10.76 6.22-2.27 2.27-8.49-8.49z"/></svg>
            Open Play Store
        </a>
    </div>
</body>
</html>
