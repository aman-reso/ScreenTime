<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppTime - Legal Documents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .documents {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        
        .document-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 25px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            display: block;
        }
        
        .document-card:hover {
            background: #e9ecef;
            border-color: #3498db;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.2);
        }
        
        .document-card h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.5em;
            border: none;
            padding: 0;
        }
        
        .document-card p {
            color: #7f8c8d;
            margin: 0;
            text-align: left;
        }
        
        .icon {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AppTime</h1>
        <p class="subtitle">Legal Documents</p>
        
        <div class="documents">
            <a href="privacy-policy.html" class="document-card">
                <div class="icon">🔒</div>
                <h2>Privacy Policy</h2>
                <p>Learn how we collect, use, and protect your information when you use our app.</p>
            </a>
            
            <a href="terms-and-conditions.html" class="document-card">
                <div class="icon">📋</div>
                <h2>Terms & Conditions</h2>
                <p>Read our terms of service and understand your rights and responsibilities.</p>
            </a>
        </div>
    </div>
</body>
</html>
